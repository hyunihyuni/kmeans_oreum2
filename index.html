e:`안세미`,location:`제주시 봉개동`,prominence:91,elevation:396.4,lng:126.608124,lat:33.467098,description:`비고 91m. 말굽형(북동향) 형태의 오름. 오름 기슭 아래에 있는 샘터를 중심으로 안쪽과 바깥쪽에 있는 두 화산체를 두고 안새미와 밧새미라고 부른다.`},{id:7,engName:`baeg-yagi`,name:`백약이오름`,location:`서귀포시 표선면 성읍리`,prominence:132,elevation:356.9,lng:126.7897666,lat:33.43680944,description:`비고 132m의 원형 화구를 지닌 화산체이다. 예부터 약초가 많이 자생하고 있어 백약이오름이라 명칭되었다.`},{id:8,engName:`balgeun`,name:`밝은오름`,location:`제주시 한림읍 상명리`,prominence:43,elevation:182.5,lng:126.265854,lat:33.360935,description:`비고 43m의 북향 말굽형 굼부리를 지닌 화산체. 비고도 낮고 규모도 작은 편이다.`},{id:9,engName:`banong`,name:`바농오름`,location:`제주시 조천읍 교래리`,prominence:142,elevation:552.1,lng:126.6538018,lat:33.45377549,description:`비고 142m의 복합형 화구를 지닌 화산체이다. 바농은 바늘의 제주 방언을 말하며 과거 오름 주변에 유난히 가시덤불이 많아 명칭되었다.`},{id:10,engName:`bichimi`,name:`비치미오름`,location:`제주시 구좌읍 송당리`,prominence:109,elevation:344.1,lng:126.76329,lat:33.426395,description:`비고 109m의 말굽형 화산체이다.`},{id:11,engName:`botdol`,name:`밧돌오름`,location:`제주시 구좌읍 송당리`,prominence:103,elevation:352.8,lng:126.76297,lat:33.460716,description:`비고 103m의 오름. 동쪽 봉우리와 서쪽 봉우리에 바윗돌이 박혀 있고. 양쪽 봉우리 사이 북사면으로 패인 골짜기가 북동쪽으로 벌어진 말굽형 화구를 이룬다.`},{id:12,engName:`cheona`,name:`천아오름`,location:`제주시 한림읍 상대리`,prominence:49,elevation:133.6,lng:126.298607,lat:33.404919,description:`비고 49m의 말굽형(서남향) 화구를 지닌 화산체이다. 초낭(참나무)가 많아 붙여진 명칭이다.`},{id:13,engName:`chik`,name:`칡오름`,location:`서귀포시 상효동`,prominence:96,elevation:271,lng:126.603737,lat:33.283329,description:`비고 96m의 원형 화구를 지닌 화산체이다.`},{id:14,engName:`daebyeongak`,name:`대병악`,location:`서귀포시 안덕면 상창리`,prominence:132,elevation:491.9,lng:126.367577,lat:33.306248,description:`비고 132m의 말굽형 화구를 지닌 화산체이다. 소병악과 나란히 위치해있고 크기에 따라 대. 소병악이라 명칭되었다.`},{id:15,engName:`daesusanbong`,name:`대수산봉`,location:`서귀포시 성산읍 고성리`,prominence:97,elevation:137.3,lng:126.902069,lat:33.438522,description:`비고 97m의 원형 화구를 지닌 화산체이다. 과거 봉수대 흔적이 어렴풋이 남아있다. 산정부를 제외한 전 사면이 삼나무와 해송으로 숲을 이룬다.`},{id:16,engName:`daewangsan`,name:`대왕산`,location:`서귀포시 성산읍 수산리`,prominence:83,elevatio ng:126.795341,lat:33.502773,description:`비고 152m의 말굽형(남향) 화구를 가진 화산체이다. 소나무. 삼나무. 편백나무 군락으로 이루어져 있으며 해송과 억새 또한 넓게 분포되어 있다.`},{id:27,engName:`dusanbong`,name:`두산봉`,location:`서귀포시 성산읍 시흥리`,prominence:101,elevation:126.5,lng:126.885353,lat:33.481148,description:`비고 101m의 복합형 화구를 지닌 화산체이다. 이중식 화산체. 동남사면에 이르는 화구륜은 침식되어 절벽을 이루고. 북서쪽 사면에는 풀밭이 평지를 이룬다.`},{id:28,engName:`eodae`,name:`어대오름`,location:`제주시 구좌읍 덕천리`,prominence:55,elevation:210.5,lng:126.7608417,lat:33.49564978,description:`비고 55m의 말굽형(북서향) 화구를 가진 화산체이다.`},{id:29,engName:`eodo`,name:`어도오름`,location:`제주시 애월읍 봉성리`,prominence:73,elevation:143,lng:126.307381,lat:33.421005,description:`비고 73m의 말굽형(북향) 화구를 가진 화산체. 경사가 완만하고 산책로가 잘 정비되어있다.`},{id:30,engName:`eunwolbong`,name:`은월봉(윤드리오름)`,location:`제주시 구좌읍 종달리`,prominence:75,elevation:179.6,lng:126.854477,lat:33.46896,description:`비고 75m의 말굽형(북동향) 화구를 지닌 화산체이다. 남동쪽에 소나무와 삼나무가 조림되어 깊은 숲을 이룬다.`},{id:31,engName:`gabseon-i`,name:`갑선이오름`,location:`서귀포시 표선면 가시리`,prominence:83,elevation:188.2,lng:126.781845,lat:33.359951,description:`비고 83m의 말굽형 화구를 지닌 화산체이다. 껍질을 미처 벗지 못한 매미의 굼벵이와 그 모습이 닮아 붙여진 명칭이다.`},{id:32,engName:`gae`,name:`개오름(성읍)`,location:`서귀포시 표선면 성읍리`,prominence:130,elevation:344.7,lng:126.772675,lat:33.423016,description:`비고 130m의 원추형 화구를 지닌 화산체이다. 전망권이 괜찮은 편이다.`},{id:33,engName:`gama`,name:`가마오름`,location:`제주시 한경면 청수리`,prominence:51,elevation:140.5,lng:126.246628,lat:33.305321,description:`비고 51m 말굽형(북동향) 화구를 지닌 화산체. 일제시대 일본군이 주둔했던 곳으로 현재도 인공적으로 파인 수직굴이 존재한다.`},{id:34,engName:`gamnang`,name:`감낭오름`,location:`서귀포시 안덕면 동광리`,prominence:45,elevation:439.8,lng:126.350502,lat:33.324684,description:`비고 45m의 말굽형 화구를 지닌 화산체. 지금은 아니지만. 이전에 오름 주변에 감나무가 많아 지어진 명칭이다.`},{id:35,engName:`gase`,name:`가세오름`,location:`서귀포시 표선면 토산리`,prominence:101,elevation:200.5,lng:126.78109,lat:33.331295,description:`비고 101m의 말굽형(남서향) 화구를 지닌 화산체이다. 오름의 형세가 가세(가위)를 닮았다고 해서 붙여진 명칭이다.`},{id:36,engName:`gasi`,name:`가시오름`,location:`서귀포시 대정읍 동일리`,prominence:77,elevation:106,lng:126.243866,lat:33.247208,descri ,location:`서귀포시 대정읍 상모리`,prominence:99,elevation:104,lng:126.289551,lat:33.200703,description:`비고 99m의 복합형 화산체. 정상에서 마라도. 가파도. 산방산. 한라산 등 제주 명소들을 비롯하여 해안 전망이 매우 좋다.`},{id:79,engName:`susanbong`,name:`수산봉(물메)`,location:`제주시 애월읍 수산리`,prominence:92,elevation:121.5,lng:126.388649,lat:33.473545,description:`비고 92m. 원추형 분화구를 지니고 정상에 물이 고인 작은 연못이 있어 '물메' 혹은 정상에 봉수가 있어 '수산봉'이라 부른다. 제주올레 16코스에 포함되어 있다.`},{id:80,engName:`tong`,name:`통오름`,location:`서귀포시 성산읍 난산리`,prominence:43,elevation:143.1,lng:126.855972,lat:33.39328,description:`비고 43m의 말굽형(서향) 화구를 지닌 화산체이다. 굼부리 안은 농경지로 개간이 되어 있다. 제주오름에 포함된 곳이기도 하다.`},{id:81,engName:`tosanbong`,name:`토산봉`,location:`서귀포시 표선면 토산리`,prominence:75,elevation:175.4,lng:126.773849,lat:33.32391,description:`비고 75m의 복합형 화구를 지닌 화산체이다. 마을과 인접해있고 산책로 정비가 잘 되어있으며 제주올레 4코스를 지난다.`},{id:82,engName:`ttalabi`,name:`따라비오름`,location:`서귀포시 표선면 가시리`,prominence:107,elevation:342,lng:126.754288,lat:33.38892,description:`비고 107m의 복합형 화산체이다. 3개의 굼부리가 이어진 모습이 특징이다.`},{id:83,engName:`ujinjebi`,name:`우진제비`,location:`제주시 조천읍 선흘리`,prominence:126,elevation:410,lng:126.698135,lat:33.467384,description:`비고 126m의 오름. 둥글고 통통한 산체에 서쪽 봉우리가 주봉이며 북동쪽으로 벌어진 말굽형 화구체를 가진 화산체.`},{id:84,engName:`wollangji`,name:`월랑지`,location:`서귀포시 표선면 성읍리`,prominence:35,elevation:260.2,lng:126.809734,lat:33.438665,description:`비고 35m의 말굽형(북향) 화구를 지닌 화산체이다. 외부에서는 낮고 앙증맞은 모습이지만 산체 내부는 깊은 숲을 이루고 있다.`},{id:85,engName:`wonmul`,name:`원물오름`,location:`서귀포시 안덕면 동광리`,prominence:98,elevation:458.5,lng:126.344551,lat:33.322323,description:`비고 80m의 말굽형 화구를 지닌 화산체. 비교적 완만한 경사이고 조망권 또한 괜찮은 편이다.`},{id:86,engName:`yeol-anji`,name:`열안지오름`,location:`제주시 봉개동`,prominence:54,elevation:328,lng:126.605356,lat:33.47307434,description:`비고 54m의 말굽형(북향) 화구를 가진 화산체이다.`},{id:87,engName:`yeongcheonak`,name:`영천악`,location:`서귀포시 상효동`,prominence:97,elevation:277,lng:126.600677,lat:33.295338,description:`비고 97m의 원형 화구를 지닌 화산체이다. 잘 정리된 산책로가 5.16도로까지 이어져있다.`},{id:88,engName:`yeongjusan`,name:`영주산`,location:`서귀포시 표선면 성읍리`,prominence:176,e
